<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - QR Attendance System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: #f1f5f9; color: #1e293b; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; width: 100%; max-width: 460px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); padding: 36px; border: 1px solid #e2e8f0; }
        .card h1 { font-size: 24px; font-weight: 700; color: #0f172a; margin-bottom: 8px; text-align: center; }
        .card p.subtitle { font-size: 14px; color: #64748b; text-align: center; margin-bottom: 24px; }
        .alert { padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; font-weight: 500; }
        .alert-error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 10px 14px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .btn { display: block; width: 100%; padding: 12px; font-size: 15px; font-weight: 600; color: #ffffff; background-color: #2563eb; border: none; border-radius: 6px; cursor: pointer; transition: background-color 0.2s; margin-top: 10px; }
        .btn:hover { background-color: #1d4ed8; }
        .footer-links { margin-top: 24px; text-align: center; font-size: 13px; color: #64748b; }
        .footer-links a { color: #2563eb; text-decoration: none; font-weight: 600; }
        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Student Registration</h1>
        <p class="subtitle">Create an account to track your lecture attendance</p>

        <!-- Error Alert -->
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" th:value="${name}" placeholder="e.g. Rahul Sharma" required autofocus>
            </div>
            <div class="form-group">
                <label for="studentId">Student ID / Roll Number</label>
                <input type="text" id="studentId" name="studentId" th:value="${studentId}" placeholder="e.g. 2024CS101" required>
            </div>
            <div class="form-group">
                <label for="email">College Email Address</label>
                <input type="email" id="email" name="email" th:value="${email}" placeholder="e.g. rahul@college.edu" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a strong password" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required>
            </div>
            <button type="submit" class="btn">Register</button>
        </form>

        <div class="footer-links">
            <p>Already registered? <a th:href="@{/login}">Log in here</a></p>
            <p style="margin-top: 6px;"><a th:href="@{/}">Back to Home</a></p>
        </div>
    </div>
</body>
</html>
